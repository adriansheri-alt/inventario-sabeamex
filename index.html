<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabeamex · Acceso</title>
<style>
  :root{
    --ink:#1c1b19; --ink2:#4a4843; --ink3:#7a766d; --paper:#f4f2ed; --card:#fbfaf7;
    --line:#d9d4ca; --line2:#e7e3da;
    --negro:#1c1b19; --rojo:#b23a2e; --naranja:#c97b21; --verde:#3f7d4f;
    --rojo-bg:#f3e2df; --naranja-bg:#f6ecd9; --verde-bg:#e4ede4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;background-image:radial-gradient(var(--line2) 0.5px,transparent 0.5px);background-size:22px 22px;min-height:100vh}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:780px;margin:0 auto;padding:22px 20px 60px}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{width:100%;max-width:380px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:34px 28px}
  .lkick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .lt{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
  .ls{font-size:12.5px;color:var(--ink2);margin-bottom:22px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink2);margin-bottom:6px}
  .fld input{width:100%;font-family:Arial,sans-serif;font-size:15px;padding:12px 13px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);outline:none}
  .fld input:focus{border-color:var(--ink)}
  .lbtn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:4px;background:var(--ink);color:var(--paper);font-family:Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer}
  .lbtn:active{opacity:.85}
  .lerr{display:none;margin-top:14px;font-size:12.5px;color:var(--rojo);font-weight:700;text-align:center}
  .lfoot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--ink3);line-height:1.5;text-align:center}
  #app{display:none}

  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px;margin-bottom:24px;position:sticky;top:10px;z-index:10}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:4px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;border:none;background:none;font-family:Arial,sans-serif}
  .tab small{display:block;font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
  .tab.active{background:var(--ink);color:var(--paper)} .tab.active small{color:#b8b3a8}
  .view{display:none}.view.active{display:block}
  .top{border-bottom:2px solid var(--ink);padding-bottom:16px}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:3px;white-space:nowrap}
  .tag-i{background:var(--ink);color:var(--paper)} .tag-c{background:var(--rojo);color:#fff}
  h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.06;margin:8px 0 4px}
  .sub{font-size:13px;color:var(--ink2)}
  .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink2)}
  .meta b{color:var(--ink);font-weight:700}
  section{margin-top:32px}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-n{font-size:12px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums}
  .sec-t{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .bar{display:flex;height:50px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .bar>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;min-width:0}
  .seg-v{background:var(--verde)}.seg-n{background:var(--negro)}.seg-r{background:var(--rojo)}.seg-o{background:var(--naranja)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  @media(min-width:560px){.legend{grid-template-columns:repeat(4,1fr)}}
  .lg{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--card)}
  .lg .dot{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:middle}
  .lg .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
  .lg .n{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .lg .pz{font-size:11px;color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
  .lg .desc{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.35;border-top:1px solid var(--line2);padding-top:8px}
  .barkey{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:10px}
  .barkey span{display:flex;align-items:center;gap:6px}.barkey i{width:9px;height:9px;border-radius:2px}
  .push{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--card)}
  .push .row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2)}
  .push .row:last-child{border-bottom:none}
  .chip{font-size:11px;font-weight:700;padding:4px 8px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip-r{background:var(--rojo-bg);color:var(--rojo)} .chip-o{background:var(--naranja-bg);color:var(--naranja)}
  .pname{font-weight:700;font-size:14px;flex:1}
  .pqty{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .note{font-size:12.5px;color:var(--ink2);padding:13px 15px;background:var(--card);border:1px dashed var(--line);border-radius:4px;margin-top:10px;line-height:1.45}
  .note b{color:var(--ink);font-weight:700}
  .rules{display:grid;gap:10px}
  .rule{display:flex;gap:13px;align-items:flex-start;border-left:3px solid var(--ink);padding:11px 0 11px 15px}
  .rule .rn{font-weight:700;font-size:13px;color:var(--ink3);padding-top:1px;font-variant-numeric:tabular-nums}
  .rule .rt{font-size:13.5px}.rule .rt b{font-weight:800}
  .off{border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .off .orow{display:grid;grid-template-columns:1fr 90px 50px;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line2);background:var(--card)}
  .off .orow:last-child{border-bottom:none}
  .off .on{font-weight:700;font-size:13.5px}
  .off .ob{height:6px;background:var(--line2);border-radius:3px;position:relative;overflow:hidden}
  .off .ob span{position:absolute;inset:0 auto 0 0;background:var(--rojo);border-radius:3px}
  .off .op{font-size:14px;font-weight:800;text-align:right;color:var(--rojo);font-variant-numeric:tabular-nums}
  .hero{margin-top:28px;border:1px solid var(--line);border-radius:5px;background:var(--card);padding:24px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rojo)}
  .hero .hl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
  .hero .hn{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
  .hero .hs{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .hero .hctx{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:13px;line-height:1.5}
  .hero .hctx b{color:var(--rojo);font-weight:700}
  .split{display:flex;height:40px;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .split .sr{background:var(--negro);color:#fff;display:flex;align-items:center;padding:0 14px;font-size:12.5px;font-weight:700}
  .split .su{background:var(--naranja);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0}
  .splitleg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sleg{border:1px solid var(--line);border-radius:4px;padding:13px;background:var(--card)}
  .sleg .h{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
  .sleg .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  .sleg .v{font-size:20px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .sleg .d{font-size:11.5px;color:var(--ink2);line-height:1.35;font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
  .stat{border:1px solid var(--line);border-radius:4px;padding:15px;background:var(--card)}
  .stat .sl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
  .stat .sn{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
  .stat .sd{font-size:11px;color:var(--ink3);margin-top:3px}
  .stat.bad .sn{color:var(--rojo)} .stat.warn .sn{color:var(--naranja)}
  .plays{display:grid;gap:12px}
  .play{display:flex;gap:15px;border:1px solid var(--line);border-radius:4px;padding:16px;background:var(--card)}
  .play .pn{font-size:22px;font-weight:800;color:var(--ink3);line-height:1;font-variant-numeric:tabular-nums}
  .play .pt{font-size:14.5px;font-weight:800;margin-bottom:3px}
  .play .pd{font-size:12.5px;color:var(--ink2);line-height:1.45}
  .foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);line-height:1.5}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="lcard">
    <div class="lkick">Sabeamex</div>
    <div class="lt">Inventario Otay</div>
    <div class="ls">Acceso restringido. Ingresa tus credenciales.</div>
    <div class="fld"><label>Usuario</label><input type="text" id="u" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
    <div class="fld"><label>Contrase&ntilde;a</label><input type="password" id="p" autocomplete="off"></div>
    <button class="lbtn" id="go">Entrar</button>
    <div class="lerr" id="err">Usuario o contrase&ntilde;a incorrectos.</div>
    <div class="lfoot">Documento confidencial &middot; uso interno Sabeamex</div>
  </div>
</div>

<div id="app"><div class="wrap" id="wrap"></div></div>

function mulberry32(a){return function(){a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return (t^t>>>14)>>>0;};}
function tryLogin(){
  var u=document.getElementById('u').value.trim();
  var p=document.getElementById('p').value;
  var rng=mulberry32(xmur3(u+":"+p));
  var raw=atob(CIPHER);var bytes=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++){bytes[i]=raw.charCodeAt(i)^(rng()&0xFF);}
  var txt="";try{txt=new TextDecoder('utf-8',{fatal:false}).decode(bytes);}catch(e){}
  if(txt.indexOf("OK::")===0){
    document.getElementById('wrap').innerHTML=txt.slice(4);
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    window.scrollTo(0,0);
  }else{document.getElementById('err').style.display='block';document.getElementById('p').value='';}
}
document.getElementById('go').addEventListener('click',tryLogin);
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
document.getElementById('u').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('p').focus();});
function show(id,btn){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }
