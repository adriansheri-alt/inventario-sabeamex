<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Sabeamex · Fechas de Caducidad</title>
<style>
  :root{--ink:#1a1a1a;--soft:#666;--line:#e2e2e2;--bg:#fff;--panel:#fafafa;--rojo:#c0392b;--naranja:#e08e0b;--verde:#2e7d4f;--negro:#333;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:780px;margin:0 auto;padding:20px 18px 56px}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{width:100%;max-width:360px;border:1px solid var(--line);border-radius:8px;padding:30px 24px}
  .lkick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:bold}
  .lt{font-size:22px;font-weight:bold;margin:6px 0 2px}.ls{font-size:13px;color:var(--soft);margin-bottom:20px}
  .fld{margin-bottom:13px}.fld label{display:block;font-size:12px;font-weight:bold;color:var(--soft);margin-bottom:5px}
  .fld input{width:100%;font-family:Arial;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:6px;outline:none}
  .fld input:focus{border-color:var(--ink)}
  .lbtn{width:100%;margin-top:6px;padding:12px;border:none;border-radius:6px;background:var(--ink);color:#fff;font-family:Arial;font-size:15px;font-weight:bold;cursor:pointer}
  .lerr{display:none;margin-top:12px;font-size:13px;color:var(--rojo);font-weight:bold;text-align:center}
  #app{display:none}
  .kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:bold}
  h1{font-size:24px;font-weight:bold;margin:5px 0 3px}.sub{font-size:13px;color:var(--soft)}
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:18px 0 4px}
  .card{text-align:left;border:1px solid var(--line);border-radius:8px;padding:13px 12px;background:#fff;cursor:pointer;font-family:Arial}
  .card.active{border-color:var(--ink);border-width:2px;background:var(--panel)}
  .card .cn{font-size:15px;font-weight:bold}.card .cs{font-size:10.5px;color:var(--soft);margin-top:1px}
  .card .cstat{font-size:17px;font-weight:bold;margin-top:8px}
  .view{display:none;margin-top:22px}.view.active{display:block}
  .sec-t{font-size:19px;font-weight:bold;margin-bottom:4px}
  .subt{font-size:14px;font-weight:bold;margin:24px 0 10px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft)}.meta b{color:var(--ink)}
  .bar{display:flex;height:42px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .bar>div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:bold;color:#fff;min-width:0}
  .sv{background:var(--verde)}.sn{background:var(--negro)}.sr{background:var(--rojo)}.so{background:var(--naranja)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .lg{border:1px solid var(--line);border-radius:6px;padding:11px}
  .lg .dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
  .lg .lbl{font-size:11px;font-weight:bold;color:var(--soft)}.lg .n{font-size:20px;font-weight:bold;margin-top:5px}
  .lg .pz{font-size:11px;color:var(--soft);margin-top:1px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--soft);font-weight:bold;padding:8px;border-bottom:2px solid var(--line)}
  th.r,td.r{text-align:right}
  td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}td:first-child{font-weight:bold}
  .chip{display:inline-block;font-size:11px;font-weight:bold;padding:3px 7px;border-radius:4px}
  .cr{background:#fbeceb;color:var(--rojo)}.co{background:#fdf4e3;color:var(--naranja)}
  .note{font-size:12.5px;color:var(--soft);padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:12px;line-height:1.45}.note b{color:var(--ink)}
  .hero{border:1px solid var(--line);border-radius:7px;padding:18px;margin-top:16px;border-left:4px solid var(--rojo)}
  .hero .hl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:bold}
  .hero .hn{font-size:38px;font-weight:bold;color:var(--rojo);margin:8px 0 3px}.hero .hs{font-size:13px;color:var(--soft)}
  .rules{display:grid;gap:8px}.rule{font-size:13px;padding:9px 0 9px 13px;border-left:3px solid var(--ink)}.rule b{font-weight:bold}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .total{border:2px solid #c0392b;border-radius:8px;padding:11px 15px;text-align:right;background:#fff;min-width:150px}
  .total .tl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:bold}
  .total .tn{font-size:28px;font-weight:bold;color:#c0392b;line-height:1.05;margin:3px 0 2px}
  .total .td{font-size:10.5px;color:var(--soft)}
  .card .clbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:bold;margin-top:9px}
  .card .cstat{font-size:20px;font-weight:bold;margin-top:2px}
</style></head><body>
<div class="gate" id="gate"><div class="lcard">
  <div class="lkick">Sabeamex</div><div class="lt">Inventario · Fechas</div><div class="ls">Acceso restringido.</div>
  <div class="fld"><label>Usuario</label><input type="text" id="u" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
  <div class="fld"><label>Contrase&ntilde;a</label><input type="password" id="p" autocomplete="off"></div>
  <button class="lbtn" id="go">Entrar</button><div class="lerr" id="err">Usuario o contrase&ntilde;a incorrectos.</div>
</div></div>
<div id="app"><div class="wrap" id="wrap"></div></div>
